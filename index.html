<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>منوی کافه</title>
<style>
  :root{
    --bg:#f7f3ee; --card:#fff; --text:#231f1c; --muted:#7a6f66;
    --accent:#6f4e37; --accent2:#e8ddd3; --line:#e6ddd5;
    --radius:18px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1613; --card:#241e1a; --text:#f3ece6; --muted:#a79a8f;
      --accent:#d9a066; --accent2:#3a2d24; --line:#3a2e27;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1613; --card:#241e1a; --text:#f3ece6; --muted:#a79a8f;
    --accent:#d9a066; --accent2:#3a2d24; --line:#3a2e27;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family: Tahoma, Vazirmatn, system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--text); line-height:1.8;
  }
  .wrap{max-width:920px; margin:0 auto; padding:18px}
  header{
    background:linear-gradient(135deg,#3b2a20,#6f4e37);
    color:#fff; border-radius:0 0 28px 28px;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 18px 22px;
  }
  header .inner{max-width:920px; margin:0 auto}
  h1{margin:0; font-size:26px}
  .sub{opacity:.85; margin-top:6px; font-size:14px}
  .search{
    width:100%; margin-top:16px; padding:13px 16px; border:0; border-radius:14px;
    font:inherit; outline:none; background:#fff; color:#231f1c;
  }
  .chips{display:flex; gap:8px; overflow-x:auto; padding:16px 0 4px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap; border:1px solid var(--line); background:var(--card); color:var(--text);
    padding:9px 14px; border-radius:999px; font:inherit; cursor:pointer;
  }
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}
  .grid{display:grid; grid-template-columns:1fr; gap:12px; margin:16px 0 30px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; display:flex; gap:12px; align-items:flex-start;
  }
  .emoji{
    width:52px; height:52px; flex:0 0 52px; display:grid; place-items:center;
    background:var(--accent2); border-radius:15px; font-size:26px;
  }
  .card h3{margin:0; font-size:16px}
  .desc{margin:2px 0 0; color:var(--muted); font-size:13px}
  .price{margin-top:8px; font-weight:700; color:var(--accent); font-size:14px}
  .empty{text-align:center; color:var(--muted); padding:28px}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:0 0 28px}
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>کافه من</h1>
    <div class="sub">منوی امروز • قیمت‌ها به تومان</div>
    <input id="search" class="search" type="search" placeholder="جستجو در منو…" />
  </div>
</header>

<main class="wrap">
  <div id="chips" class="chips"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>چیزی پیدا نشد.</div>
  <footer>ساخته‌شده برای کافه • برای سفارش به صندوق مراجعه کنید</footer>
</main>

<script>
  // ↓↓↓ منو را همین‌جا عوض کن ↓↓↓
  const menuItems = [
    { name:"اسپرسو", desc:"تک شات، دانه مدیوم", price:65000, category:"قهوه گرم", emoji:"☕" },
    { name:"آمریکانو", desc:"اسپرسو + آب گرم", price:75000, category:"قهوه گرم", emoji:"☕" },
    { name:"کاپوچینو", desc:"شیر بخارپز و فوم", price:95000, category:"قهوه گرم", emoji:"🥛" },
    { name:"لاته", desc:"نرم و شیری", price:95000, category:"قهوه گرم", emoji:"🥛" },
    { name:"آیس لاته", desc:"سرد با یخ", price:105000, category:"قهوه سرد", emoji:"🧊" },
    { name:"آیس آمریکانو", desc:"سرد و سبک", price:85000, category:"قهوه سرد", emoji:"🧊" },
    { name:"چای سیاه", desc:"دم‌کرده با نبات", price:45000, category:"دمنوش", emoji:"🍵" },
    { name:"دمنوش به‌لیمو", desc:"خوش‌عطر و گرم", price:55000, category:"دمنوش", emoji:"🍵" },
    { name:"چیزکیک", desc:"با سس توت‌فرنگی", price:120000, category:"کیک", emoji:"🍰" },
    { name:"براونی", desc:"شکلاتی و گرم", price:110000, category:"کیک", emoji:"🍫" },
    { name:"آب پرتقال", desc:"تازه", price:80000, category:"نوشیدنی سرد", emoji:"🍊" },
    { name:"لیموناد", desc:"خنک و ترش", price:85000, category:"نوشیدنی سرد", emoji:"🍋" }
  ];

  const fmt = new Intl.NumberFormat("fa-IR");
  const chips = document.getElementById("chips");
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const search = document.getElementById("search");

  let activeCat = "همه";
  let query = "";

  const cats = ["همه", ...new Set(menuItems.map(i => i.category))];

  function renderChips(){
    chips.innerHTML = "";
    cats.forEach(cat => {
      const b = document.createElement("button");
      b.className = "chip" + (cat === activeCat ? " active" : "");
      b.textContent = cat;
      b.onclick = () => { activeCat = cat; renderChips(); render(); };
      chips.appendChild(b);
    });
  }

  function render(){
    const q = query.trim().toLowerCase();
    const items = menuItems.filter(i => {
      const okCat = activeCat === "همه" || i.category === activeCat;
      const okQ = !q || (i.name + " " + i.desc + " " + i.category).toLowerCase().includes(q);
      return okCat && okQ;
    });

    grid.innerHTML = "";
    empty.hidden = items.length > 0;

    items.forEach(i => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="emoji">${i.emoji || "☕"}</div>
        <div>
          <h3>${i.name}</h3>
          <p class="desc">${i.desc || ""}</p>
          <div class="price">${fmt.format(i.price)} تومان</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  search.addEventListener("input", e => { query = e.target.value; render(); });
  renderChips();
  render();
</script>
</body>
</html>
